
name: Vérification HTML

on:
  push:
    branches:
      - master
      - feature/github-actions
  pull_request:
    branches:
      - master

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence de index.html
        run: test -f index.html
